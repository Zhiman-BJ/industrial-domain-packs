name: Domain source checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  chip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Locked JavaScript sources and release identity
        run: npm ci --ignore-scripts && npm run lock:check && npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked environment
        run: |
          python -m pip install uv==0.11.6
          uv sync --frozen --directory packs/chip/eda-harness
      - name: Imported contract and runtime tests
        run: uv run --frozen --directory packs/chip/eda-harness pytest -q
      - name: Real stdio MCP discovery
        run: uv run --frozen --directory packs/chip/eda-harness python ../scripts/mcp-smoke.py
      - name: Build committed source archive
        run: |
          for pack in chip godot pcb freecad cad; do
            python scripts/package-pack.py "$pack" --output dist
          done
