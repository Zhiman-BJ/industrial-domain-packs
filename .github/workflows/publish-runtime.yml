name: Publish remote runtime

# Explicit dispatch avoids generated-lock loops and keeps PRs credentialless.
on:
  workflow_dispatch:
    inputs:
      domain:
        type: choice
        required: true
        options: [chip, freecad, pcb]
      environment:
        type: choice
        required: true
        options: [test, prod]

permissions:
  contents: write
  actions: read

# A single source-branch writer avoids competing content-lock commits.
concurrency:
  group: runtime-publication-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.domain }} ${{ inputs.environment }}
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && (inputs.environment != 'prod' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: ${{ inputs.environment }}
    env:
      PUBLICATION_DOMAIN: ${{ inputs.domain }}
      PUBLICATION_ENVIRONMENT: ${{ inputs.environment }}
      TENCENT_REGION: ${{ vars.TENCENT_REGION }}
      TENCENT_IMAGE_PREFIX: ${{ vars.TENCENT_IMAGE_PREFIX }}
      TENCENT_TOOL_CONFIGURATION: ${{ vars.TENCENT_TOOL_CONFIGURATION }}
    steps:
      - name: Set publication scratch directory
        run: echo "PUBLICATION_DIRECTORY=$RUNNER_TEMP/runtime-publication" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: docker/setup-buildx-action@v3
      - name: Registry hostname
        shell: bash
        run: |
          registry="${TENCENT_IMAGE_PREFIX%%/*}"
          [[ "$registry" =~ ^[a-z0-9.-]+$ ]] || exit 1
          echo "REGISTRY_HOST=$registry" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.TENCENT_REGISTRY_USERNAME }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}
      - name: Locate previous publication intent
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const {findIntent} = require('./scripts/runtime-publication-resume.cjs');
            const prior = await findIntent(github, {
              ...context.repo, source: context.sha,
              domain: process.env.PUBLICATION_DOMAIN,
              environment: process.env.PUBLICATION_ENVIRONMENT,
              runId: Number(process.env.GITHUB_RUN_ID),
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            });
            if (prior) {
              core.setOutput('artifact-id', prior.artifactId);
              core.setOutput('artifact-name', prior.artifactName);
              core.setOutput('run-id', prior.runId);
            }
      - name: Restore exact prior intent
        if: steps.previous.outputs.artifact-id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.previous.outputs.artifact-name }}
          run-id: ${{ steps.previous.outputs.run-id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/runtime-publication
      - name: Build or verify image; prepare Tool intent
        run: node scripts/publish-runtime.cjs prepare
      - name: Persist intent before cloud mutation
        id: intent
        uses: actions/upload-artifact@v4
        with:
          name: runtime-intent-${{ inputs.domain }}-${{ inputs.environment }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/runtime-publication/plan.json
            ${{ runner.temp }}/runtime-publication/registry.json
      - name: Create or reconcile Tool and verify readback
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          PUBLICATION_INTENT_ARTIFACT_ID: ${{ steps.intent.outputs.artifact-id }}
        run: node scripts/publish-runtime.cjs tool
      - name: Preserve successful publication evidence before writeback
        uses: actions/upload-artifact@v4
        with:
          name: runtime-result-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: ${{ runner.temp }}/runtime-publication/result.json
      - name: Write release lock and final content hash to source branch
        run: node scripts/publish-runtime.cjs writeback
