name: Publish remote runtime

# Main publishes prod automatically; other branches publish test on dispatch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: runtime-publication-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.domain }} ${{ github.ref == 'refs/heads/main' && 'prod' || 'test' }}
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        domain: [chip, freecad, pcb]
    env:
      PUBLICATION_DOMAIN: ${{ matrix.domain }}
      PUBLICATION_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'prod' || 'test' }}
      TENCENT_ROLE_ARN: ${{ vars.TENCENT_ROLE_ARN }}
    steps:
      - name: Set publication scratch directory
        run: echo "PUBLICATION_DIRECTORY=$RUNNER_TEMP/runtime-publication" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Read checked-in publication configuration
        id: config
        run: node scripts/publish-runtime.cjs configure
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.config.outputs.registry-host }}
          username: ${{ secrets.TENCENT_REGISTRY_USERNAME }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}
      - name: Locate previous publication intent
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const {findIntent} = require('./scripts/runtime-publication-resume.cjs');
            const prior = await findIntent(github, {
              ...context.repo, source: context.sha,
              domain: process.env.PUBLICATION_DOMAIN,
              environment: process.env.PUBLICATION_ENVIRONMENT,
              runId: Number(process.env.GITHUB_RUN_ID),
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            });
            if (prior) {
              core.setOutput('artifact-id', prior.artifactId);
              core.setOutput('artifact-name', prior.artifactName);
              core.setOutput('run-id', prior.runId);
            }
      - name: Restore exact prior intent
        if: steps.previous.outputs.artifact-id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.previous.outputs.artifact-name }}
          run-id: ${{ steps.previous.outputs.run-id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/runtime-publication
      - name: Build or verify image; prepare Tool intent
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: node scripts/publish-runtime.cjs prepare
      - name: Report image repository capacity
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: node scripts/runtime-image-capacity.cjs
      - name: Persist intent before cloud mutation
        id: intent
        uses: actions/upload-artifact@v4
        with:
          name: runtime-intent-${{ matrix.domain }}-${{ env.PUBLICATION_ENVIRONMENT }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/runtime-publication/plan.json
            ${{ runner.temp }}/runtime-publication/registry.json
      - name: Create or reconcile Tool and verify readback
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          PUBLICATION_INTENT_ARTIFACT_ID: ${{ steps.intent.outputs.artifact-id }}
        run: node scripts/publish-runtime.cjs tool
      - name: Preserve partial and successful publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-result-${{ matrix.domain }}-${{ github.run_id }}
          overwrite: true
          if-no-files-found: ignore
          retention-days: 90
          path: |
            ${{ runner.temp }}/runtime-publication/plan.json
            ${{ runner.temp }}/runtime-publication/image.json
            ${{ runner.temp }}/runtime-publication/image-operation.json
            ${{ runner.temp }}/runtime-publication/result.json

  # Keep checkout on GITHUB_TOKEN: its writeback push does not trigger workflows.
  finish:
    name: Write locks and publication summary
    needs: publish
    if: always() && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PUBLICATION_DOMAINS: '["chip","freecad","pcb"]'
      TENCENT_ROLE_ARN: ${{ vars.TENCENT_ROLE_ARN }}
    steps:
      - name: Set collection scratch directory
        run: echo "PUBLICATION_DIRECTORY=$RUNNER_TEMP/runtime-results" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-result-*-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-results
      - name: Write release locks and final content hash once
        id: writeback
        if: needs.publish.result == 'success'
        run: node scripts/runtime-publication-batch.cjs writeback
      - name: Show cloud results and lock writeback status
        if: always()
        env:
          PUBLICATION_WRITEBACK_STATUS: ${{ steps.writeback.outcome }}
        run: node scripts/runtime-publication-batch.cjs summary
