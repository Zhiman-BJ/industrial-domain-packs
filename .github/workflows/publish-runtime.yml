name: Publish remote runtime

# Main publishes prod; same-repository PR heads publish test and receive locks.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  actions: read

concurrency:
  group: runtime-publication-${{ github.repository }}
  cancel-in-progress: false

env:
  PUBLICATION_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.head_ref) || github.ref }}
  PUBLICATION_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  gate:
    name: Select publication source
    if: >-
      (github.event_name != 'pull_request' && github.ref_type == 'branch') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref != 'main' &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PUBLICATION_SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/content-lock.cjs --check
      - name: Ignore generated lock writeback for publication
        id: source
        run: node scripts/runtime-publication-trigger.cjs
      - name: Require token that triggers PR checks after writeback
        if: steps.source.outputs.publish == 'true' && env.PUBLICATION_REF != 'refs/heads/main'
        env:
          WRITEBACK_TOKEN: ${{ secrets.PACK_BUMP_PAT }}
        run: node -e 'if (!process.env.WRITEBACK_TOKEN) throw Error("PACK_BUMP_PAT is required for feature-branch lock writeback")'

  check:
    name: Check ${{ matrix.domain }} ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && 'prod' || 'test' }}
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        domain: [chip, freecad, pcb]
    env:
      PUBLICATION_DOMAIN: ${{ matrix.domain }}
      PUBLICATION_ENVIRONMENT: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && 'prod' || 'test' }}
      TENCENT_ROLE_ARN: ${{ vars.TENCENT_ROLE_ARN }}
    steps:
      - name: Set publication scratch directory
        run: echo "PUBLICATION_DIRECTORY=$RUNNER_TEMP/runtime-publication" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PUBLICATION_SOURCE }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Read checked-in publication configuration
        id: config
        run: node scripts/publish-runtime.cjs configure
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.config.outputs.registry-host }}
          username: ${{ secrets.TENCENT_REGISTRY_USERNAME }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}
      - name: Locate previous publication intent
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const {findIntent} = require('./scripts/runtime-publication-resume.cjs');
            const prior = await findIntent(github, {
              ...context.repo, source: process.env.PUBLICATION_SOURCE,
              domain: process.env.PUBLICATION_DOMAIN,
              environment: process.env.PUBLICATION_ENVIRONMENT,
              runId: Number(process.env.GITHUB_RUN_ID),
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            });
            if (prior) {
              core.setOutput('artifact-id', prior.artifactId);
              core.setOutput('artifact-name', prior.artifactName);
              core.setOutput('run-id', prior.runId);
            }
      - name: Restore exact prior intent
        if: steps.previous.outputs.artifact-id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.previous.outputs.artifact-name }}
          run-id: ${{ steps.previous.outputs.run-id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/runtime-publication
      - name: Check image and Tool reuse (read only)
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: node scripts/publish-runtime.cjs check
      - name: Preserve check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-check-${{ matrix.domain }}-${{ github.run_id }}
          overwrite: true
          if-no-files-found: ignore
          retention-days: 90
          path: |
            ${{ runner.temp }}/runtime-publication/check.json
            ${{ runner.temp }}/runtime-publication/plan.json
            ${{ runner.temp }}/runtime-publication/registry.json
            ${{ runner.temp }}/runtime-publication/image.json
            ${{ runner.temp }}/runtime-publication/image-operation.json
            ${{ runner.temp }}/runtime-publication/result.json

  plan:
    name: Select packs needing publication
    needs: check
    runs-on: ubuntu-24.04
    outputs:
      domains: ${{ steps.matrix.outputs.domains }}
      has-changes: ${{ steps.matrix.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PUBLICATION_SOURCE }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-check-*-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-checks
      - name: Select changed packs
        id: matrix
        env:
          PUBLICATION_DIRECTORY: ${{ runner.temp }}/runtime-checks
        run: node scripts/runtime-publication-matrix.cjs

  publish:
    name: Publish ${{ matrix.domain }} ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && 'prod' || 'test' }}
    needs: plan
    if: needs.plan.outputs.has-changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        domain: ${{ fromJSON(needs.plan.outputs.domains) }}
    env:
      PUBLICATION_DOMAIN: ${{ matrix.domain }}
      PUBLICATION_ENVIRONMENT: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && 'prod' || 'test' }}
      TENCENT_ROLE_ARN: ${{ vars.TENCENT_ROLE_ARN }}
    steps:
      - name: Set publication scratch directory
        run: echo "PUBLICATION_DIRECTORY=$RUNNER_TEMP/runtime-publication" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PUBLICATION_SOURCE }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Read checked-in publication configuration
        id: config
        run: node scripts/publish-runtime.cjs configure
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.config.outputs.registry-host }}
          username: ${{ secrets.TENCENT_REGISTRY_USERNAME }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}
      - name: Restore checked publication plan
        uses: actions/download-artifact@v4
        with:
          name: runtime-check-${{ matrix.domain }}-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-publication
      - name: Recheck image metadata; prepare Tool intent
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: node scripts/publish-runtime.cjs prepare
      - name: Report image repository capacity
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: node scripts/runtime-image-capacity.cjs
      - name: Persist intent before cloud mutation
        id: intent
        uses: actions/upload-artifact@v4
        with:
          name: runtime-intent-${{ matrix.domain }}-${{ env.PUBLICATION_ENVIRONMENT }}-${{ env.PUBLICATION_SOURCE }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/runtime-publication/plan.json
            ${{ runner.temp }}/runtime-publication/registry.json
      - name: Create or reconcile Tool and verify readback
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          PUBLICATION_INTENT_ARTIFACT_ID: ${{ steps.intent.outputs.artifact-id }}
        run: node scripts/publish-runtime.cjs tool
      - name: Preserve partial and successful publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-result-${{ matrix.domain }}-${{ github.run_id }}
          overwrite: true
          if-no-files-found: ignore
          retention-days: 90
          path: |
            ${{ runner.temp }}/runtime-publication/plan.json
            ${{ runner.temp }}/runtime-publication/image.json
            ${{ runner.temp }}/runtime-publication/image-operation.json
            ${{ runner.temp }}/runtime-publication/result.json

  # Feature writeback uses PAT so the new head receives ordinary PR checks.
  finish:
    name: Write locks and publication summary
    needs: [gate, check, plan, publish]
    if: always() && needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PUBLICATION_DOMAINS: '["chip","freecad","pcb"]'
      PUBLICATION_CHANGED_DOMAINS: ${{ needs.plan.outputs.domains || '[]' }}
      TENCENT_ROLE_ARN: ${{ vars.TENCENT_ROLE_ARN }}
    steps:
      - name: Set collection scratch directory
        run: echo "PUBLICATION_DIRECTORY=$RUNNER_TEMP/runtime-results" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PUBLICATION_SOURCE }}
          fetch-depth: 0
          token: ${{ env.PUBLICATION_REF != 'refs/heads/main' && secrets.PACK_BUMP_PAT || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-check-*-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-results
      - uses: actions/download-artifact@v4
        if: needs.publish.result != 'skipped'
        with:
          pattern: runtime-result-*-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-results
      - name: Write release locks and final content hash once
        id: writeback
        if: needs.check.result == 'success' && needs.plan.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
        run: node scripts/runtime-publication-batch.cjs writeback
      - name: Show cloud results and lock writeback status
        if: always()
        env:
          PUBLICATION_WRITEBACK_STATUS: ${{ steps.writeback.outcome }}
        run: node scripts/runtime-publication-batch.cjs summary
